name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/internship-explorer-design-laa3qc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Preview build: placeholder content is shown, marked "Content needed".
      # Switch to `npm run build:release` once all content is approved.
      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
